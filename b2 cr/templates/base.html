<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CarePoint | Hospital management{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  color-scheme: light;
  --ink: #1c302c;
  --muted: #74827c;
  --line: #dce3de;
  --canvas: #f1f4f1;
  --green: #24654f;
  --green-dark: #184c3b;
  --white: #fff;
  --coral: #c96e50;
  --blue: #477682;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--canvas); color: var(--ink); font-family: "DM Sans", sans-serif; font-size: 14px; }
button, input, select { font: inherit; }
.sidebar { position: fixed; inset: 0 auto 0 0; width: 222px; padding: 27px 16px; background: #1b3932; color: #f5f7f3; display: flex; flex-direction: column; z-index: 2; }
.brand { display: flex; gap: 10px; align-items: center; color: #f5f7f3; text-decoration: none; font: 700 19px Manrope, sans-serif; letter-spacing: 0; }
.brand-mark { width: 33px; height: 33px; display: grid; place-items: center; border-radius: 3px; background: #d57a59; color: white; font-size: 19px; }
.brand small { display: block; margin-top: 2px; font: 600 8px "DM Sans", sans-serif; color: #b5c5bd; letter-spacing: 0; }
.nav-label, .eyebrow { color: #82958d; font-size: 10px; font-weight: 700; letter-spacing: 0; }
.nav-label { margin: 48px 0 12px 10px; }
.nav-item { height: 42px; padding: 0 11px; display: flex; align-items: center; gap: 12px; color: #c1cec8; text-decoration: none; border-radius: 3px; font-weight: 500; margin: 2px 0; }
.nav-item.active { background: #2a4a40; color: #fff; box-shadow: inset 3px 0 var(--coral); }
.nav-icon { width: 18px; font-size: 17px; text-align: center; }
.nav-count { margin-left: auto; font-size: 11px; color: #c0cdc6; }
.main-content { max-width: 1600px; margin-left: 222px; padding: 34px 40px 24px; }
.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; padding-bottom: 19px; border-bottom: 1px solid var(--line); }
h1, h2 { margin: 4px 0 0; font-family: "Source Serif 4", Georgia, serif; letter-spacing: 0; }
h1 { font-size: 29px; font-weight: 600; } h2 { font-size: 20px; font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); margin-bottom: 23px; background: #fff; border-block: 1px solid var(--line); }
.stat, .panel { background: var(--white); border: 0; border-radius: 0; }
.stat { min-height: 108px; padding: 18px 21px; border-right: 1px solid var(--line); }
.stat:last-child { border-right: 0; }
.stat-top { display: flex; align-items: center; justify-content: space-between; color: #72827b; font-size: 12px; }
.stat strong { display: block; margin-top: 8px; font: 600 27px Manrope, sans-serif; letter-spacing: 0; }
.stat:nth-child(2) strong { color: var(--coral); }
.stat:nth-child(3) strong { color: var(--blue); }
.stat small { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
.stat-icon { display: none; }
.workspace-grid { display: grid; grid-template-columns: minmax(0, 1.8fr) minmax(300px, .82fr); gap: 22px; align-items: start; }
.panel { min-width: 0; overflow: hidden; border-top: 2px solid #294b40; }
.appointments-panel { border-top-color: var(--coral); }
.appointment-form-panel { border-top-color: var(--blue); }
.panel-heading { min-height: 78px; padding: 17px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.search { width: 190px; height: 35px; padding: 0 10px; border: 1px solid #d9e1db; border-radius: 2px; display: flex; align-items: center; gap: 7px; color: #667b71; }
.search input { border: 0; outline: 0; min-width: 0; width: 100%; color: var(--ink); background: transparent; font-size: 12px; }
.table-wrap { width: 100%; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; text-align: left; white-space: nowrap; }
th { height: 37px; background: #f3f6f3; color: #687a71; font-size: 10px; font-weight: 700; }
td { height: 55px; border-top: 1px solid #e8ede9; color: #52655c; font-size: 12px; }
tbody tr:hover td { background: #f6f8f6; }
th, td { padding: 0 12px; } th:first-child, td:first-child { padding-left: 19px; }
td strong { color: #263e34; font-size: 12px; font-weight: 600; }
.patient-cell { display: flex; align-items: center; gap: 8px; }
.patient-avatar { flex: 0 0 27px; height: 27px; border-radius: 2px; display: grid; place-items: center; font-weight: 700; font-size: 10px; }
.color-0 { background: #dcebe4; color: #32634f; }.color-1 { background: #f4e5de; color: #9f5b43; }.color-2 { background: #e0eaec; color: #426c77; }.color-3 { background: #e9e8dd; color: #6a684c; }
.muted { color: #76877e; }.visit-count { min-width: 22px; display: inline-grid; place-items: center; padding: 3px 6px; background: #edf2ee; border-radius: 2px; color: #4f695b; }
.heading-symbol { display: none; }
.form-grid { padding: 0 20px 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 11px; }
.form-grid label { min-width: 0; display: flex; flex-direction: column; gap: 6px; color: #53685e; font-size: 11px; font-weight: 600; }
.form-grid .wide { grid-column: 1 / -1; }
.form-grid input, .form-grid select { width: 100%; min-width: 0; height: 38px; padding: 0 10px; border: 1px solid #d8e0da; border-radius: 2px; outline: 0; background: #fff; color: #31473d; font-size: 12px; }
.form-grid input:focus, .form-grid select:focus, .search:focus-within { border-color: #49806b; box-shadow: 0 0 0 2px #e5eee8; }
.form-grid input::placeholder { color: #acb8b1; }
.primary-button, .secondary-button { min-height: 40px; border: 0; border-radius: 2px; cursor: pointer; font-size: 12px; font-weight: 700; }
.primary-button { background: var(--green); color: #fff; }.primary-button:hover { background: var(--green-dark); }
.secondary-button { display: flex; align-items: center; justify-content: space-between; padding: 0 12px; background: #f0e7df; color: #744b38; }.secondary-button:hover { background: #e9d9cd; }.secondary-button span { font-size: 17px; }
.lower-grid { display: grid; grid-template-columns: minmax(0, 1.8fr) minmax(300px, .82fr); gap: 22px; margin-top: 22px; align-items: start; }
.subtle-count { color: #8b9992; font-size: 11px; }.table-subtext { display: block; margin-top: 3px; color: #93a098; font-size: 10px; }
.status { display: inline-block; padding: 4px 7px; border-radius: 2px; background: #f5ece5; color: #9a563f; font-size: 10px; }.status.completed { background: #e9efeb; color: #4c685a; }
.complete-button { width: 25px; height: 25px; border: 1px solid #d7e0da; border-radius: 2px; background: white; color: var(--green); cursor: pointer; }.complete-button:hover { background: #eaf1ec; }
.row-actions { display: flex; align-items: center; gap: 8px; }
.row-actions details { position: relative; }
.row-actions summary { color: var(--green); cursor: pointer; font-size: 11px; font-weight: 700; }
.inline-edit-form { position: absolute; top: 22px; right: 0; z-index: 3; display: grid; gap: 8px; width: 220px; padding: 12px; border: 1px solid var(--line); background: #fff; box-shadow: 0 8px 24px rgba(18, 38, 30, 0.12); white-space: normal; }
.inline-edit-form label, .database-actions label { display: grid; gap: 4px; color: #53685e; font-size: 10px; font-weight: 600; }
.inline-edit-form input, .inline-edit-form select, .database-actions input { min-width: 0; width: 100%; height: 32px; padding: 0 8px; border: 1px solid #d8e0da; background: #fff; color: var(--ink); font-size: 12px; }
.small-action { display: inline-flex; align-items: center; justify-content: center; min-height: 28px; padding: 0 9px; border: 1px solid #d7e0da; background: #fff; color: var(--green); text-decoration: none; font-size: 10px; font-weight: 700; cursor: pointer; }
.small-action:hover { background: #edf3ef; }
.danger-action { color: #a54d3e; }
.danger-action:hover { background: #fbefea; }
.appointment-filters { display: flex; align-items: end; gap: 7px; margin-left: auto; }
.appointment-filters label { display: grid; gap: 4px; color: #687a71; font-size: 9px; font-weight: 700; }
.appointment-filters select { max-width: 130px; height: 30px; padding: 0 6px; border: 1px solid #d9e1db; background: #fff; color: var(--ink); font-size: 10px; }
.clear-filter { color: var(--muted); font-size: 10px; }
.database-panel { margin-top: 22px; }
.database-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 0 20px 20px; }
.database-actions p { margin: 6px 0 12px; color: var(--muted); font-size: 11px; }
.database-actions form { display: grid; align-content: start; gap: 8px; padding: 12px; border: 1px solid #f0d9d2; background: #fffaf8; }
.link-action { width: fit-content; }
.empty-state { height: 75px; text-align: center; color: #91a098; white-space: normal; }
.empty-callout { margin: 0 20px 20px; padding: 17px 0; border-top: 1px solid var(--line); color: #77877f; font-size: 12px; text-align: left; }
footer { padding: 22px 2px 0; color: #9aa79f; font-size: 10px; } footer span { padding: 0 4px; }
.flash-stack { display: grid; gap: 7px; margin: -8px 0 15px; }.flash { padding: 10px 13px; border-radius: 5px; font-size: 12px; }.flash.success { background: #e7f3ec; color: #276b50; }.flash.error { background: #fbefea; color: #a54d3e; }
.admin-login-link { display: inline-flex; align-items: center; justify-content: center; height: 36px; padding: 0 14px; border-radius: 999px; background: #edf3ef; color: #1d4337; text-decoration: none; font-size: 12px; font-weight: 700; border: 1px solid #dfe9e3; }
.login-body { min-height: 100vh; display: grid; place-items: center; background: linear-gradient(135deg, #edf3f0 0%, #e8f0ef 100%); }
.login-wrapper { width: min(100%, 420px); padding: 24px; }
.login-card { background: #fff; border: 1px solid #dfe9e3; border-radius: 16px; padding: 32px 28px 24px; box-shadow: 0 18px 45px rgba(18, 38, 30, 0.08); }
.login-logo { width: 54px; height: 54px; display: grid; place-items: center; border-radius: 14px; background: #1d4337; color: #fff; font-size: 28px; margin: 0 auto 18px; }
.login-card h1 { margin: 0; text-align: center; font-size: 28px; }
.login-card p { text-align: center; margin: 10px 0 20px; color: #64776d; }
.login-form { display: grid; gap: 12px; }
.login-form label { font-size: 12px; font-weight: 700; color: #51675f; }
.login-form input { width: 100%; height: 44px; border: 1px solid #d6dfd8; border-radius: 10px; padding: 0 12px; font-size: 14px; outline: 0; }
.login-form input:focus { border-color: #2a6d5c; box-shadow: 0 0 0 3px rgba(42, 109, 92, 0.12); }
.login-form button { height: 46px; border: 0; border-radius: 10px; background: #1d4337; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 6px; }
.login-form button:hover { background: #123327; }
.login-flash { margin: 0 0 18px; }
@media (max-width: 1100px) {
  .main-content { padding: 25px 22px; }
  .workspace-grid, .lower-grid { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 700px) {
  .sidebar { position: sticky; top: 0; width: 100%; height: auto; padding: 10px 14px 8px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; border-right: 0; border-bottom: 1px solid #36534a; }
  .brand { grid-column: 1 / -1; font-size: 17px; padding-bottom: 5px; }.brand-mark { width: 29px; height: 29px; }.nav-label { display: none; }
  .nav-item { height: 35px; justify-content: center; gap: 5px; padding: 0 4px; font-size: 11px; }.nav-count { display: none; }
  .main-content { margin-left: 0; padding: 22px 14px; }
  .topbar { align-items: flex-start; }.topbar h1 { font-size: 25px; }
  .stats { margin-bottom: 17px; }.stat { min-height: 94px; padding: 13px 10px; }.stat strong { font-size: 21px; }.stat-top { font-size: 10px; }
  .panel-heading { padding: 14px; }.form-grid { padding: 0 14px 15px; }.search { width: 145px; }
  .patients-panel td, .patients-panel th { padding-right: 10px; }.patients-panel td:first-child, .patients-panel th:first-child { padding-left: 14px; }
  .appointment-filters { flex-wrap: wrap; margin-left: 0; }.panel-heading:has(.appointment-filters) { flex-wrap: wrap; }
  .database-actions { grid-template-columns: 1fr; padding: 0 14px 15px; }
}
  </style>
  {% block page_styles %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
